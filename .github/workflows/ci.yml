name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bufferpad
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '18.19.0'
          cache: npm
          cache-dependency-path: bufferpad/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Unit tests
        run: npm run unit -- --runInBand
      - name: Production build
        run: npm run build
        env:
          NODE_OPTIONS: --openssl-legacy-provider

  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/check-repository.py

  powershell:
    name: PowerShell
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Parse tracked PowerShell files
        shell: pwsh
        run: ./scripts/check-powershell.ps1
      - name: Parse UTF-8 source with Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/check-powershell.ps1
      - name: Verify missing-HSL guidance in a clean checkout
        shell: pwsh
        run: |
          try {
            ./scripts/build-backend.ps1
            throw 'Expected missing-HSL failure did not occur.'
          } catch {
            if ($_.Exception.Message -notlike '*is not distributed with this repository*') { throw }
            Write-Host 'Missing-HSL prerequisite message verified; backend build/tests are not run in CI.'
          }
