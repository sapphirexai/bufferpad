name: 功能建议 / Feature request
description: 说明实际使用问题和期望的改进 / Explain a use case and improvement
title: '[Feature] '
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem to solve
      description: Who encounters it, and in what workflow? / 谁在什么操作过程中遇到问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望行为 / Proposed behavior
      description: Describe a concrete example and what success would look like. / 给出具体例子和验收方式。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与限制 / Alternatives and constraints
      description: Optional. Include compatibility needs; do not share production credentials. / 可选，说明兼容性要求。
