# nginx配置
server {
    listen       8081;# 配置端口
    server_name  localhost; # 修改为docker服务宿主机的ip
 
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
 
    error_page   500 502 503 504  /50x.html;

    location = /50x.html {
        root   html;
    }

    # 代理后端地址
    location /api/ {
        proxy_pass http://host.docker.internal:9001/;
    }

}