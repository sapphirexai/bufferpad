server {
    listen 80;
    server_name _;

    root /usr/share/nginx/bufferpad;
    index index.html index.htm;

    location / {
        auth_request /_bufferpad_session;
        error_page 401 = @bufferpad_login;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    location @bufferpad_login {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        return 302 /login;
    }

    location = /login {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    location /static/ {
        try_files $uri =404;
    }

    location = /static/config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # Verify the real server session before serving protected SPA documents.
    location = /_bufferpad_session {
        internal;
        proxy_pass http://127.0.0.1:19001/auth/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header Cookie $http_cookie;
        proxy_cache off;
    }

    location /api/sse/ {
        proxy_pass http://127.0.0.1:19001/sse/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:19001/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
